services:
  roadmap-api:
    build: .
    image: roadmap-region-api:1.0.0
    container_name: roadmap-region-api
    ports:
      - "8000:8000"
    environment:
      ROADMAP_DB_PATH: /data/roadmap.db
    volumes:
      - roadmap-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  roadmap-data:
